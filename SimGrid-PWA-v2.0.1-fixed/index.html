<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#090b10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SimGrid">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="SimGrid — локальный менеджер автосимулятора, телеметрии, сетапов и стратегии.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>SimGrid</title>
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Основная навигация">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div><strong>SimGrid</strong><small>Race intelligence</small></div>
      </div>
      <nav id="desktopNav" class="nav-list"></nav>
      <div class="sidebar-footer">
        <button class="profile-switch" id="profileSwitch" type="button">
          <span class="profile-avatar" id="profileAvatar">S</span>
          <span><strong id="activeProfileName">Sprint</strong><small id="profileGameHint">GT / Formula</small></span>
          <span class="chevron">⌄</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="pageEyebrow">Центр пилота</p>
          <h1 id="pageTitle">Обзор</h1>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="quickAddBtn" type="button" aria-label="Добавить сессию">＋</button>
          <button class="icon-button" id="themeBtn" type="button" aria-label="Выбрать тему">◐</button>
          <button class="install-button hidden" id="installBtn" type="button">Установить</button>
        </div>
      </header>

      <section id="view" class="view" aria-live="polite"></section>
    </main>

    <nav id="mobileNav" class="bottom-nav" aria-label="Мобильная навигация"></nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <input id="importInput" type="file" accept=".json,.csv,.simgrid" hidden>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
